name: Macro-enhanced ML research (paper-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trade_lab/macro.py'
      - 'scripts/macro_research.py'
      - 'tests/test_macro.py'
      - '.github/workflows/macro_research.yml'
permissions:
  contents: read
concurrency:
  group: market-edge-macro-research
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_BUCKET: market-edge-history
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - name: Install research dependencies
        run: python -m pip install -r requirements-ml.txt pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Compare price-only vs lagged macro ML
        run: python scripts/macro_research.py