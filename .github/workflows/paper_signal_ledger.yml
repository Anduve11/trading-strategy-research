name: Frozen pre-entry paper signals (no orders)
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 12 * * 1-5'
    - cron: '17 23 * * 1-5'
  push:
    branches: [main]
    paths: ['trade_lab/paper_signals.py', 'scripts/paper_signal_ledger.py', '.github/workflows/paper_signal_ledger.yml']
permissions:
  contents: read
concurrency:
  group: market-edge-paper-ledger-v1
  cancel-in-progress: false
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - run: python -m pip install -r requirements-ml.txt pytest
      - run: python -m pytest -q
      - run: python scripts/paper_signal_ledger.py
