name: Expected-profit and cross-asset research (paper-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trade_lab/edge_research.py'
      - 'trade_lab/cross_asset.py'
      - 'scripts/edge_research.py'
      - '.github/workflows/edge_research.yml'

permissions:
  contents: read
concurrency:
  group: market-edge-expected-profit-v1
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_BUCKET: market-edge-history
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - run: python -m pip install -r requirements-ml.txt pytest
      - run: python -m pytest -q
      - name: Run registered cost-aware hypotheses and save results privately
        run: python scripts/edge_research.py
