name: Leveraged ETF universe research (paper-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trade_lab/etf_universe.py'
      - 'trade_lab/window_quality.py'
      - 'scripts/universe_research.py'
      - '.github/workflows/universe_research.yml'
permissions:
  contents: read
concurrency:
  group: market-edge-universe-v1
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pair: [nasdaq3, nasdaq2, sp500, smallcap, semiconductors, technology, financials, biotech]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - run: python -m pip install -r requirements-ml.txt pytest
      - run: python -m pytest -q
      - name: Resume real-price monthly pair archive
        run: python scripts/universe_research.py --pair ${{ matrix.pair }} --mode archive
      - name: Evaluate pair and date-matched Nasdaq control
        run: python scripts/universe_research.py --pair ${{ matrix.pair }} --mode evaluate
