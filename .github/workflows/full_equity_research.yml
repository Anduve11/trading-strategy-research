name: Full-equity strategy research (paper-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['trade_lab/full_allocation.py', 'scripts/full_equity_research.py', '.github/workflows/full_equity_research.yml']
permissions:
  contents: read
concurrency:
  group: market-edge-full-equity-v1
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - run: python -m pip install -r requirements-ml.txt pytest
      - run: python -m pytest -q
      - run: python scripts/full_equity_research.py --all
