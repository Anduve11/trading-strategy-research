name: Automated research (paper-only)

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 1 * *' # Monthly; only selected and available after one-time credentials setup

permissions:
  contents: read

concurrency:
  group: market-edge-autoresearch
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_BUCKET: market-edge-history
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run private, read-only backtests
        run: python scripts/automated_research.py