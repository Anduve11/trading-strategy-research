name: Crypto baseline backtest (research-only)

on:
  pull_request:
    paths:
      - 'trade_lab/crypto_research.py'
      - 'pages/1_Crypto_Research.py'
      - 'scripts/crypto_backtest.py'
      - 'tests/test_crypto_research.py'
      - '.github/workflows/crypto-research.yml'

permissions:
  contents: read

concurrency:
  group: crypto-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ml.txt pytest
      - name: Run crypto unit tests
        run: python -m pytest -q tests/test_crypto_research.py
      - name: Fetch public bars and run cost sensitivity
        run: python scripts/crypto_backtest.py --granularity 21600 --cost-scenarios 10,25,50 --allocation-scenarios 25,50,100
